
services:
 
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_DATABASE: mydb
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
  
  optimizer:
    build:
      context: ./Proyecto_backup/optimizer-api
      dockerfile: Dockerfile
    container_name: optimizer
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - app-network

  backend:
    build:
      context: ./Proyecto_backup        
      dockerfile: Dockerfile
    container_name: springboot-app
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL_PROD: ${SPRING_DATASOURCE_URL_PROD}
      SPRING_DATASOURCE_USERNAME_PROD: ${SPRING_DATASOURCE_USERNAME_PROD}
      SPRING_DATASOURCE_PASSWORD_PROD: ${SPRING_DATASOURCE_PASSWORD_PROD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO}
      MONGODB_URI: ${MONGODB_URI}
      API_KEY: ${API_KEY}
      URL_DOCKER_LLM: ${URL_LLM}
      MODEL_LLM: ${MODEL_LLM}
      URL_FRONTEND: ${URL_FRONTEND}
      MY_SECRET_KEY: ${MY_SECRET_KEY}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      PORT_MCP: ${PORT_MCP}
      api-key: ${API_KEY_EMBEDDING}
      URL_EMBEDDING: ${URL_EMBEDDING}
      MODEL_EMBEDDING: ${MODEL_EMBEDDING}
      KEY_PUBLICA_SUPABASE: ${KEY_PUBLICA_SUPABASE}
      KEY_PRIVADA_SUPABASE: ${KEY_PRIVADA_SUPABASE}
      ENDPOINT_MCP: ${ENDPOINT_MCP}
      LOOPBACK_ONLY: ${LOOPBACK_ONLY}
      NOMBRE_BUCKET_FILE: ${NOMBRE_BUCKET_FILE}
      OPTIMIZER_API_URL: ${OPTIMIZER_API_URL}
    networks:
      - app-network
    volumes:
      - ./Proyecto_backup/uploads:/app/uploads

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: react-app
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      VITE_CLIENT_API_UR: ${VITE_CLIENT_API_URL}
      VITE_CLIENT_WS_URL: ${VITE_CLIENT_WS_URL}
      VITE_SUPABASE_URL: ${KEY_PUBLICA_SUPABASE}
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:

