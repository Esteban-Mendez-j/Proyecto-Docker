server:
  port: ${PORT_MCP}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL_PROD}
    username: ${SPRING_DATASOURCE_USERNAME_PROD}
    password: ${SPRING_DATASOURCE_PASSWORD_PROD}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        id:
          new_generator_mappings: true
  data:
    mongodb:
        uri: ${MONGODB_URI}
    
  mvc:
    format:
      date: yyyy-MM-dd
      date-time: yyyy-MM-dd'T'HH:mm:ss
      time: HH:mm:ss

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  ai:
    openai:
      api-key: ${API_KEY}
      base-url: ${URL_LLM}
      chat:
        options:
          model: ${MODEL_LLM}
      embedding:
        api-key: ${API_KEY_EMBEDDING}
        base-url: ${URL_EMBEDDING}
        options:
          model: ${MODEL_EMBEDDING}
    mcp:
      server:
        name: searchjobs-mcp
        version: 1.0.0
        type: SYNC
        protocol: STATELESS
      client:
        enabled: false
        toolcallback:
          enabled: false
          
    mongodb:
        collection-name: vector_store
        initialize-schema: true
        path-name: embedding
        indexName: vector_index
    
app:
  url:
    frontEnd: ${URL_FRONTEND}  
  supabase:
    key:
      publica: ${KEY_PUBLICA_SUPABASE}
      privada: ${KEY_PRIVADA_SUPABASE}
  mcp:
    endpoint: ${ENDPOINT_MCP}
    loopback-only: ${LOOPBACK_ONLY}
    debug-tools: false
    client-timeout-seconds: 30
    files:
      bucket: ${NOMBRE_BUCKET_FILE}
      max-bytes: 1048576
    vacantes:
      cargo-property: nombre
      allow-delete: false 

optimizer:
  api:
    url: ${OPTIMIZER_API_URL}
    
security:
  jwt:
    key:
      private: ${MY_SECRET_KEY}
    user:
      generator: SEARCHJOBS-BACKEND
    expiration: ${JWT_EXPIRATION}
